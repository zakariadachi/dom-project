<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusDirect — Cabine</title>
  <link rel="stylesheet" href="style.css">
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">

  <header class="bg-white shadow-sm sticky top-0 z-10">
    <section class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex gap-2 items-center">
        <img src="img/logo.png" alt="logo" class="w-[50px] h-[40px]">
        <h1 class="text-xl font-bold text-sky-900">
          <a href="./index.html">BusDirect</a>
        </h1>
      </div>
      <a class="text-sm font-medium text-cyan-700 hover:text-sky-900" href="./index.html">← Retour au réseau</a>
    </section>
  </header>

  <main class="max-w-6xl mx-auto px-4 my-6 flex flex-col gap-6">

    <!-- Trip Header -->
    <section class="rounded-2xl bg-white p-5 shadow">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-sky-100">
            <img src="img/trajet.png" alt="trajet" class="h-7 w-7">
          </div>
          <div>
            <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Trajet</p>
            <h2 id="tripRoute" class="text-xl font-semibold text-slate-800">…</h2>
            <p id="tripTime" class="text-sm text-slate-500"></p>
          </div>
        </div>
        <span id="tripPrice" class="rounded-xl bg-sky-50 px-4 py-1 text-sm font-semibold text-sky-700 ring-1 ring-sky-100"></span>
      </div>

      <!-- Legend -->
      <div class="mt-4 flex flex-wrap gap-4 border-t border-slate-100 pt-4 text-sm">
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 rounded bg-white border border-slate-300"></div><span>Libre</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 rounded bg-amber-100 border border-amber-300"></div><span>VIP (sièges 01–04)</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 rounded bg-green-500"></div><span>Occupé</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 rounded bg-amber-400"></div><span>VIP Occupé</span>
        </div>
      </div>
    </section>

    <!-- Stats bar -->
    <section class="rounded-2xl bg-white p-4 shadow flex flex-wrap gap-6 justify-around text-sm">
      <div><span class="font-semibold text-slate-600">Places disponibles : </span><span id="places" class="font-bold text-blue-700"></span></div>
      <div><span class="font-semibold text-slate-600">Recette : </span><span id="prix" class="font-bold text-green-700"></span></div>
    </section>

    <div class="flex flex-col lg:flex-row gap-6">

      <!-- Seat Grid -->
      <section class="bg-blue-50 rounded-2xl shadow p-4 lg:w-1/2">
        <div class="bg-white rounded-xl p-3 mb-4 font-medium text-center text-slate-600">🧑‍✈️ Conducteur</div>
        <div id="seatGrid" class="grid grid-cols-[1fr_1fr_0.3fr_1fr_1fr] gap-2"></div>
      </section>

      <!-- Forms -->
      <div class="flex flex-col gap-4 lg:w-1/2">

        <!-- Reserve -->
        <section class="bg-white rounded-2xl shadow p-5">
          <h2 class="text-base font-semibold mb-4">Réserver une place</h2>
          <label class="block text-sm font-medium mb-1">Nom du passager</label>
          <input type="text" id="nameInput" placeholder="ex. Aymen Lahlou"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-[#F0F4FF] mb-3 text-sm">
          <label class="block text-sm font-medium mb-1">Téléphone</label>
          <input type="text" id="phoneInput" placeholder="06XXXXXXXX ou 07XXXXXXXX"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-[#F0F4FF] mb-3 text-sm">
          <label class="block text-sm font-medium mb-1">Siège (optionnel — cliquez sur le plan)</label>
          <div class="flex gap-2">
            <input type="text" id="seatInput" placeholder="N° de siège"
              class="flex-1 border border-slate-300 rounded-lg px-3 py-2 bg-[#F0F4FF] text-sm">
            <button type="button" id="reserveButton"
              class="px-4 py-2 rounded-xl bg-[#0039A6] text-white text-sm font-medium">Confirmer</button>
          </div>
          <p id="message" class="mt-3 text-sm font-medium"></p>
        </section>

        <!-- Modify -->
        <section class="bg-white rounded-2xl shadow p-5">
          <h2 class="text-base font-semibold mb-4">Modifier une réservation</h2>
          <label class="block text-sm font-medium mb-1">Passager existant</label>
          <select id="changeSelect"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-[#F0F4FF] mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
          </select>
          <label class="block text-sm font-medium mb-1">Nouveau nom</label>
          <input type="text" id="modifyNameInput" placeholder="Modifier le nom"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-[#F0F4FF] mb-3 text-sm">
          <label class="block text-sm font-medium mb-1">Nouveau téléphone</label>
          <input type="text" id="modifyPhoneInput" placeholder="06XXXXXXXX ou 07XXXXXXXX"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-[#F0F4FF] mb-3 text-sm">
          <label class="block text-sm font-medium mb-1">Nouveau siège</label>
          <div class="flex gap-2">
            <input type="text" id="newSeat" placeholder="N° de siège"
              class="flex-1 border border-slate-300 rounded-lg px-3 py-2 bg-[#F0F4FF] text-sm">
            <button type="button" id="modifyBtn"
              class="px-4 py-2 rounded-xl bg-blue-100 text-blue-800 text-sm font-medium">Modifier</button>
          </div>
          <p id="modifyMessage" class="mt-3 text-sm font-medium"></p>
        </section>

        <!-- Cancel -->
        <section class="bg-white rounded-2xl shadow p-5">
          <h2 class="text-base font-semibold mb-4">Annuler une réservation</h2>
          <label class="block text-sm font-medium mb-1">Passager réservé</label>
          <div class="flex gap-2">
            <select id="supSelect"
              class="flex-1 border border-slate-300 rounded-lg px-3 py-2 bg-[#F0F4FF] text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            </select>
            <button type="button" id="supBtn"
              class="px-4 py-2 rounded-xl bg-red-100 text-red-600 text-sm font-medium">Annuler</button>
          </div>
          <p id="supMessage" class="mt-3 text-sm font-medium"></p>
        </section>

        <!-- Waiting List -->
        <section class="bg-white rounded-2xl shadow p-5" id="liste_attente">
          <!-- rendered by JS -->
        </section>

      </div>
    </div>
  </main>

  <script type="module" src="./JS/main-cabine.js"></script>
</body>
</html>
